# Application
spring.application.name=nestvantage-api
server.port=8080

# PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nestvantage}
spring.datasource.username=${DB_USERNAME:postgres} 
spring.datasource.password=${DB_PASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# # Database platform
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.5-flash-lite

jwt.secret=${JWT_SECRET}

app.demo-user-password=${DEMO_USER_PASSWORD:}

app.admin-password=${APP_ADMIN_PASSWORD:}